<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kesselklang Festival</title>
<meta name="description" content="Programm und Geländeplan des Kesselklang Festivals. Funktioniert auch ohne Internet.">
<meta name="theme-color" content="#1b1530">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* Keine externen Schriften oder Bibliotheken: alles muss im Flugmodus funktionieren. */
:root{
  --bg:#f4f2fa; --surface:#ffffff; --ink:#1b1530; --muted:#5d5873; --line:#e2deef; --chip:#ebe8f5;
  --accent:#6a3df0; --on-accent:#ffffff; --accent-soft:#e9e2ff;
  --now:#ffc83d; --now-ink:#4a3500; --now-soft:#fff3cf;
  --ok:#13804f; --ok-soft:#dcf3e7; --warn:#9a5b00; --warn-soft:#fdebc8;
  --map-bg:#dcefc9; --map-forest:#b3d797; --map-path:#fbf7ec; --map-edge:#9cbf83; --map-text:#1b1530;
  --st-H:#6a3df0; --st-Z:#a77a0e; --st-W:#2e7d32;
  --c-wc:#1f6fd1; --c-food:#e0661a; --c-drink:#c0267a; --c-water:#0f8fa6; --c-aid:#d62e2e;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --display:"Avenir Next","Segoe UI Variable Display","Segoe UI",-apple-system,Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#120e20; --surface:#1c1730; --ink:#efecf8; --muted:#a7a1bd; --line:#2e2846; --chip:#272140;
  --accent:#9b7bff; --on-accent:#140c2e; --accent-soft:#2c2350;
  --now:#ffc83d; --now-ink:#3a2a00; --now-soft:#3a2f12;
  --ok:#5fd39b; --ok-soft:#163a2a; --warn:#f2b54a; --warn-soft:#3a2c10;
  --map-bg:#22331b; --map-forest:#2f4a25; --map-path:#46523f; --map-edge:#3b5530; --map-text:#efecf8;
  color-scheme:dark}}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;letter-spacing:-.01em}
p{margin:0}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
.top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));background:#1b1530;color:#fff}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{display:block;font:700 18px/1.1 var(--display)}
.brand small{display:block;font:600 12px/1.3 var(--mono);color:#ffd977;font-variant-numeric:tabular-nums}
.logo{width:34px;height:34px;border-radius:10px;background:#ffc83d;display:grid;place-items:center;flex:none}
.net{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.12);color:#fff;white-space:nowrap}
.net i{width:8px;height:8px;border-radius:50%;background:#bbb}
.net.ok i{background:#5fd39b}
.net.wait i{background:#ffc83d}

main{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.vin{padding:18px max(16px,env(safe-area-inset-right)) 28px max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-size:26px;font-weight:700}
h2{font-size:17px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}

.tabs{flex:none;display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--line);padding:4px max(8px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;font-size:12px;font-weight:700;color:var(--muted);border-radius:12px}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1*max(16px,env(safe-area-inset-right))) 0 calc(-1*max(16px,env(safe-area-inset-left)));padding:0 max(16px,env(safe-area-inset-right)) 2px max(16px,env(safe-area-inset-left))}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;white-space:nowrap;min-height:38px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:14px;padding:4px}
.seg button{border:0;background:none;border-radius:11px;padding:9px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-weight:700;min-height:42px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{min-height:34px;padding:6px 11px;font-size:13.5px;border-radius:10px}
.btn.ghost{border-color:transparent;background:none;color:var(--accent);padding-inline:4px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
.pill.now{background:var(--now);color:var(--now-ink)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.soon{background:var(--accent-soft);color:var(--accent)}

/* Jetzt */
.clock{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--now-soft);border-radius:14px;padding:10px 12px}
.clock b{font:700 15px var(--mono);font-variant-numeric:tabular-nums}
.clockset{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.clockset label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:700;color:var(--muted)}
.clockset select,.clockset input{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;min-height:42px;width:100%}
.stage{display:grid;grid-template-columns:6px minmax(0,1fr);gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 14px 14px 0;overflow:hidden}
.stage>i{border-radius:0 6px 6px 0}
.stage .st-name{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stage .act{font:700 19px/1.2 var(--display);margin-top:6px}
.stage .meta{font-size:13.5px;color:var(--muted)}
.stage .next{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:14px}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.qt{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.qt .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
.qt b{font:700 18px var(--mono);font-variant-numeric:tabular-nums}
.qt span{font-size:12px;color:var(--muted);line-height:1.25}

/* Programm */
.acts{display:flex;flex-direction:column;gap:8px}
.actc{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.actc.past{opacity:.55}
.actc.running{border-color:var(--now);box-shadow:inset 4px 0 0 var(--now)}
.acth{width:100%;border:0;background:none;display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 14px;text-align:left}
.atime{font:600 13px/1.4 var(--mono);font-variant-numeric:tabular-nums;color:var(--muted);display:flex;flex-direction:column}
.atime b{color:var(--ink)}
.aname{font-weight:700;font-size:16px;line-height:1.25}
.ameta{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:2px}
.adet{padding:0 14px 14px 84px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.chev{transition:transform .15s}
.acth[aria-expanded="true"] .chev{transform:rotate(180deg)}

/* Plan */
.mapwrap{position:relative;background:var(--map-bg);border-radius:20px;overflow:hidden;border:1px solid var(--line);touch-action:manipulation}
.mapwrap.placing{outline:3px dashed var(--accent);outline-offset:-3px;cursor:crosshair}
#map{display:block;width:100%;height:auto}
.mk{cursor:pointer}
.mk.sel circle.ring{stroke:var(--ink);stroke-width:3}
.you{pointer-events:none}
@media (prefers-reduced-motion:no-preference){
  .pulse{animation:pulse 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2.2);opacity:0}}
}
.posbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.posbar .where{font-size:14px;min-width:0}
.posbar .where b{display:block}
.posbar select{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;min-height:34px;font-size:13.5px;max-width:100%}
.hint{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13.5px}
.poicard{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:start}
.poicard .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.near{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.near button{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;align-items:center;border:0;border-bottom:1px solid var(--line);background:none;padding:11px 14px;text-align:left}
.near button:last-child{border-bottom:0}
.near .ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.near .d{font:700 14px var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.near .d small{display:block;font:500 11.5px var(--font);color:var(--muted)}
.foot{font-size:12.5px;color:var(--muted);text-align:center;padding-top:6px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;font-weight:600;display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px);z-index:20;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.toast button{border:0;background:var(--now);color:var(--now-ink);border-radius:8px;padding:5px 10px;font-weight:700}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="#1b1530"><rect x="3" y="10" width="3.2" height="10" rx="1.6"/><rect x="8.2" y="5" width="3.2" height="15" rx="1.6"/><rect x="13.4" y="8" width="3.2" height="12" rx="1.6"/><rect x="18.6" y="12" width="3.2" height="8" rx="1.6"/></svg></span>
      <div><b>Kesselklang</b><small id="clockLbl"></small></div>
    </div>
    <span class="net" id="net" role="status"><i></i><span>Prüfe…</span></span>

  <main id="view"></main>

</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
/* ================= Beispieldaten (frei erfunden) ================= */
const DAYS=['Freitag','Samstag'];
const STAGES={
  H:{name:'Hauptbühne',x:200,y:62,w:150,h:46},
  Z:{name:'Zeltbühne',x:322,y:334,w:84,h:56},
  W:{name:'Waldbühne',x:84,y:402,w:92,h:44}
};
const ACTS=[
  {d:0,s:'W',t:'17:00',e:'18:00',n:'Moosgeflüster',g:'Folk',x:'Zweistimmiger Gesang, Geige und Kontrabass zum Ankommen.'},
  {d:0,s:'H',t:'18:00',e:'19:00',n:'Nordlicht Kollektiv',g:'Indie-Pop',x:'Sechsköpfige Band mit Bläsern, ideal zum Start ins Wochenende.'},
  {d:0,s:'W',t:'18:30',e:'19:30',n:'Tannenzapfen Trio',g:'Akustik',x:'Gitarre, Cajón und Mandoline. Sitzkissen gibt es am Waldrand.'},
  {d:0,s:'Z',t:'19:00',e:'20:00',n:'Kesselkinder',g:'Hip-Hop',x:'Stuttgarter Crew mit Live-Band und viel Publikumsbeteiligung.'},
  {d:0,s:'H',t:'19:45',e:'21:00',n:'Die Stapelfahrer',g:'Deutschrock',x:'Laute Gitarren und Texte zum Mitsingen.'},
  {d:0,s:'W',t:'20:00',e:'21:00',n:'Jona Sommerfeld',g:'Singer-Songwriter',x:'Ruhige Songs am Klavier, mit Lichterketten im Wald.'},
  {d:0,s:'Z',t:'20:30',e:'21:30',n:'Mira Okon',g:'R&B',x:'Soulige Stimme, elektronische Beats.'},
  {d:0,s:'H',t:'21:45',e:'23:30',n:'Velvet Marlin',g:'Synth-Pop · Headliner',x:'Headliner am Freitag mit großer Lichtshow.'},
  {d:0,s:'Z',t:'22:30',e:'00:30',n:'Bass im Kessel',g:'Techno · DJ-Set',x:'Zwei DJs im Wechsel bis nach Mitternacht.'},
  {d:1,s:'W',t:'15:00',e:'16:00',n:'Feldlerche',g:'Folk-Pop',x:'Leichte Melodien für den Nachmittag.'},

  {d:1,s:'H',t:'17:45',e:'19:00',n:'Glasperlen',g:'Indie-Rock',x:'Gitarrenwände und eingängige Refrains.'},
  {d:1,s:'Z',t:'18:00',e:'19:00',n:'Wortwechsel',g:'Poetry & Beats',x:'Spoken Word mit DJ-Begleitung.'},
  {d:1,s:'W',t:'18:00',e:'19:15',n:'Mondschein Quartett',g:'Jazz',x:'Jazz-Standards zum Sonnenuntergang.'},
  {d:1,s:'Z',t:'19:30',e:'20:45',n:'Kalt & Klar',g:'Post-Punk',x:'Dunkle Synthesizer und treibender Bass.'},
  {d:1,s:'H',t:'19:45',e:'21:15',n:'Neonwald',g:'Elektro-Pop',x:'Tanzbare Songs mit Visuals auf der LED-Wand.'},
  {d:1,s:'Z',t:'21:30',e:'23:00',n:'Sundown Society',g:'House',x:'Warmer House-Sound im Zelt.'},
  {d:1,s:'H',t:'22:00',e:'23:45',n:'The Lantern Sons',g:'Rock · Headliner',x:'Headliner am Samstag, Abschluss auf der Hauptbühne.'},
  {d:1,s:'Z',t:'23:30',e:'01:00',n:'Funkkessel',g:'Funk & Disco · DJ-Set',x:'Aftershow bis 1 Uhr.'}
];
const CATS={
  stage:{name:'Bühnen',one:'Bühne'},
  wc:{name:'Toiletten',one:'Toilette',color:'var(--c-wc)'},
  food:{name:'Essen',one:'Essen',color:'var(--c-food)'},
  drink:{name:'Getränke',one:'Getränke',color:'var(--c-drink)'},
  water:{name:'Wasser',one:'Trinkwasser',color:'var(--c-water)'},
  aid:{name:'Erste Hilfe',one:'Erste Hilfe',color:'var(--c-aid)'}
};
const POIS=[
  {id:'wc1',c:'wc',n:'WC Nord',x:58,y:96,i:'12 Kabinen, Händewaschen'},
  {id:'wc2',c:'wc',n:'WC Ost',x:352,y:164,i:'10 Kabinen, 1 barrierefrei'},
  {id:'wc3',c:'wc',n:'WC Mitte',x:150,y:300,i:'20 Kabinen, 2 barrierefrei, Wickeltisch'},
  {id:'wc4',c:'wc',n:'WC Süd',x:120,y:505,i:'8 Kabinen, nahe Haupteingang'},
  {id:'f1',c:'food',n:'Food Court',x:262,y:212,i:'Burger, Pommes, Falafel, Crêpes · bis 1 Uhr'},
  {id:'f2',c:'food',n:'Streetfood am Wald',x:150,y:352,i:'Maultaschen, Käsespätzle, vegane Bowls · bis 23 Uhr'},
  {id:'f3',c:'food',n:'Pizza & Pasta',x:300,y:450,i:'Pizza vom Holzofen, Pasta · bis 0 Uhr'},
  {id:'d1',c:'drink',n:'Bar Hauptbühne',x:104,y:134,i:'Bier, Softdrinks, Becherpfand 2 €'},
  {id:'d2',c:'drink',n:'Bar Zelt',x:372,y:404,i:'Bier, Longdrinks · bis 1 Uhr'},
  {id:'d3',c:'drink',n:'Cocktailbar',x:166,y:238,i:'Cocktails und alkoholfreie Drinks'},
  {id:'w1',c:'water',n:'Trinkwasser Nord',x:296,y:124,i:'Kostenlos, eigene Flasche oder Becher mitbringen'},
  {id:'w2',c:'water',n:'Trinkwasser Wald',x:38,y:340,i:'Kostenlos, 6 Zapfstellen'},
  {id:'w3',c:'water',n:'Trinkwasser Süd',x:250,y:492,i:'Kostenlos, nahe Haupteingang'},
  {id:'a1',c:'aid',n:'Sanitätszelt',x:214,y:404,i:'Rund um die Uhr besetzt, Notruf auch über jedes Ordnerteam'},
  {id:'a2',c:'aid',n:'Erste Hilfe Nord',x:346,y:74,i:'Besetzt, solange die Hauptbühne spielt'}
];
const LANDMARKS=[
  {n:'Haupteingang',x:200,y:530},{n:'Hauptbühne',x:200,y:110},{n:'Zeltbühne',x:300,y:380},
  {n:'Waldbühne',x:110,y:440},{n:'Food Court',x:262,y:232},{n:'Sanitätszelt',x:214,y:384}
];

/* ================= Hilfsfunktionen ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toMin=(s,isEnd,start)=>{const [h,m]=s.split(':').map(Number);let v=h*60+m;if(h<6)v+=1440;if(isEnd&&start!=null&&v<=start)v+=1440;return v};
ACTS.forEach(a=>{a.s0=toMin(a.t);a.s1=toMin(a.e,true,a.s0)});
const hhmm=v=>{v=((v%1440)+1440)%1440;return String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0')};
const dist=(a,b)=>Math.round(Math.hypot(a.x-b.x,a.y-b.y)*1.25/10)*10;
const walk=m=>Math.max(1,Math.round(m/60));
const inMin=v=>v<60?`${v} Min.`:`${Math.floor(v/60)} Std.${v%60?' '+(v%60)+' Min.':''}`;
const allPois=()=>[...Object.entries(STAGES).map(([k,s])=>({id:'st'+k,c:'stage',n:s.name,x:s.x,y:s.y+s.h/2,i:'Bühne',stage:k})),...POIS];
const poiById=id=>allPois().find(p=>p.id===id);
const nearest=c=>POIS.filter(p=>p.c===c).map(p=>({...p,m:dist(p,S.pos)})).sort((a,b)=>a.m-b.m)[0];
const whereName=p=>{const l=LANDMARKS.map(x=>({...x,m:Math.hypot(x.x-p.x,x.y-p.y)})).sort((a,b)=>a.m-b.m)[0];return l.m<35?l.n:'Nähe '+l.n};

const ICON={
  wc:'<text x="0" y="3.6" text-anchor="middle" font-size="9" font-weight="800" fill="#fff" font-family="Arial,sans-serif">WC</text>',
  food:'<path d="M-4.5-6v4.5a2 2 0 0 0 4 0V-6M-2.5-6V6M4-6c-2.2 1.5-2.2 6 0 7.5V6" stroke="#fff" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>',
  drink:'<path d="M-5-5.5h10L3 6h-6z M-4.2-1h8.4" stroke="#fff" stroke-width="1.7" fill="none" stroke-linejoin="round"/>',
  water:'<path d="M0-6.5c3 4 5 6.4 5 9a5 5 0 0 1-10 0c0-2.6 2-5 5-9z" fill="#fff"/>',
  aid:'<path d="M-2.2-6.5h4.4v4.3h4.3v4.4H2.2v4.3h-4.4V2.2h-4.3v-4.4h4.3z" fill="#fff"/>'
};
const icCircle=(c,size)=>`<span class="ic" style="background:${CATS[c].color}"><svg width="${size}" height="${size}" viewBox="-8 -8 16 16" aria-hidden="true">${ICON[c]}</svg></span>`;
const SV={
  now:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  prog:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4M7 13.5h4M7 17h7"/></svg>',
  map:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6.5v13L9 17l6 2.5 6-2.5V4l-6 2.5z"/><path d="M9 4v13M15 6.5v13"/></svg>',
  chev:'<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>',
  pin:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>'
};

/* ================= Zustand ================= */
const KEY='kesselklang-state-v1';
const DEF={tab:'now',day:1,stage:'all',cats:[],pos:{x:200,y:530},sel:null,route:false,simDay:1,simMin:1230,open:null,setClock:false,placing:false};
let S;
try{S={...DEF,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){S={...DEF}}
S.placing=false;S.setClock=false;
const save=()=>{try{const {placing,setClock,...k}=S;localStorage.setItem(KEY,JSON.stringify(k))}catch(e){}};

function statusOf(a){
  if(a.d!==S.simDay)return a.d<S.simDay?'past':'future';
  if(S.simMin>=a.s1)return 'past';
  if(S.simMin>=a.s0)return 'running';
  return 'future';
}

/* ================= Ansicht: Jetzt ================= */
function nowView(){
  const day=S.simDay,t=S.simMin;
  let h=`<div class="clock"><div><span class="eyebrow">Demozeit</span><br><b>${DAYS[day]}, ${hhmm(t)} Uhr</b></div>
    <button class="btn sm" data-act="toggleClock" aria-expanded="${S.setClock}">${S.setClock?'Fertig':'Ändern'}</button></div>`;
  if(S.setClock)h+=`<div class="clockset"><label for="cDay">Festivaltag<select id="cDay" data-ch="simDay">${DAYS.map((d,i)=>`<option value="${i}"${i===day?' selected':''}>${d}</option>`).join('')}</select></label>
    <label for="cTime">Uhrzeit<input id="cTime" type="time" step="900" value="${hhmm(t)}" data-ch="simMin"></label></div>
    <p class="small muted">Das Beispiel-Festival findet nicht wirklich statt. Mit der Demozeit zeigst du, was zu einem bestimmten Zeitpunkt läuft.</p>`;
  h+=`<h1>Was läuft gerade?</h1>`;
  for(const k of ['H','Z','W']){
    const list=ACTS.filter(a=>a.d===day&&a.s===k).sort((a,b)=>a.s0-b.s0);
    const run=list.find(a=>t>=a.s0&&t<a.s1),next=list.find(a=>a.s0>t);
    h+=`<article class="stage"><i style="background:var(--st-${k})"></i><div>
      <div class="st-name"><span class="eyebrow" style="color:var(--st-${k})">${STAGES[k].name}</span>${run?'<span class="pill now">Läuft gerade</span>':'<span class="pill">Pause</span>'}</div>
      ${run?`<p class="act">${esc(run.n)}</p><p class="meta">${esc(run.g)} · bis ${run.e} Uhr</p>`:`<p class="act muted" style="font-weight:600">${next?'Gleich geht es weiter':'Für heute vorbei'}</p>`}
      ${next?`<p class="next"><span class="muted">Danach:</span> <b>${esc(next.n)}</b> um ${next.t} <span class="muted">(in ${inMin(next.s0-t)})</span></p>`:''}
      <div style="margin-top:8px"><button class="btn ghost sm" data-act="showStage" data-v="${k}">${SV.pin} Bühne auf dem Plan</button></div>
    </div></article>`;
  }
  h+=`<section style="display:flex;flex-direction:column;gap:10px"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><h2>Schnell finden</h2><span class="small muted">ab: ${esc(whereName(S.pos))}</span></div>
    <div class="quick">${['wc','food','water'].map(c=>{const p=nearest(c);return `<button class="qt" data-act="goPoi" data-v="${p.id}">${icCircle(c,16)}<b>${walk(p.m)} Min.</b><span>${CATS[c].one}: ${esc(p.n)}</span></button>`}).join('')}</div>
    <p class="small muted">Deinen Standort legst du im Plan fest. Die Gehzeit ist geschätzt und dauert im Gedränge länger.</p></section>
    <p class="foot">Beispiel-Festival mit erfundenen Daten · Increment Sprint 1 · Stoßtruppschicht</p>`;
  return h;
}

/* ================= Ansicht: Programm ================= */
function progView(){
  let list=ACTS.filter(a=>a.d===S.day&&(S.stage==='all'||a.s===S.stage)).sort((a,b)=>a.s0-b.s0||a.s.localeCompare(b.s));
  let h=`<div><p class="eyebrow">2 Tage · 3 Bühnen · ${ACTS.length} Acts</p><h1>Programm</h1></div>
   <div class="seg" role="group" aria-label="Festivaltag">${DAYS.map((d,i)=>`<button data-act="day" data-v="${i}" aria-pressed="${S.day===i}">${d}</button>`).join('')}</div>
   <div class="chips" role="group" aria-label="Bühne filtern"><button class="chip" data-act="stage" data-v="all" aria-pressed="${S.stage==='all'}">Alle Bühnen</button>
   ${Object.entries(STAGES).map(([k,s])=>`<button class="chip" data-act="stage" data-v="${k}" aria-pressed="${S.stage===k}"><span class="dot" style="background:var(--st-${k})"></span>${s.name}</button>`).join('')}</div>
   <p class="small muted">${list.length} ${list.length===1?'Act':'Acts'} am ${DAYS[S.day]}${S.stage!=='all'?' auf der '+STAGES[S.stage].name:''}${S.day===S.simDay?` · Demozeit ${hhmm(S.simMin)} Uhr`:''}</p><div class="acts">`;
  for(const a of list){
    const st=statusOf(a),id=ACTS.indexOf(a),open=S.open===id;
    const badge=st==='running'?'<span class="pill now">Läuft gerade</span>':st==='past'&&a.d===S.simDay?'<span class="pill">Vorbei</span>':(a.d===S.simDay&&a.s0-S.simMin<=60&&a.s0>S.simMin)?`<span class="pill soon">in ${a.s0-S.simMin} Min.</span>`:'';
    h+=`<article class="actc ${st==='running'?'running':''} ${st==='past'&&a.d===S.simDay?'past':''}">
      <button class="acth" data-act="openAct" data-v="${id}" aria-expanded="${open}">
        <span class="atime"><b>${a.t}</b>${a.e}</span>
        <span><span class="aname">${esc(a.n)}</span><span class="ameta"><span class="dot" style="background:var(--st-${a.s})"></span>${STAGES[a.s].name} · ${esc(a.g)}</span>${badge?`<span style="display:block;margin-top:6px">${badge}</span>`:''}</span>
        ${SV.chev}</button>
      ${open?`<div class="adet"><p>${esc(a.x)}</p><p class="muted small">${DAYS[a.d]}, ${a.t}–${a.e} Uhr · Dauer ${inMin(a.s1-a.s0)}</p><div><button class="btn sm" data-act="showStage" data-v="${a.s}">${SV.pin} ${STAGES[a.s].name} auf dem Plan</button></div></div>`:''}
    </article>`;
  }
  return h+'</div>';
}

/* ================= Ansicht: Plan ================= */
function mapSVG(){
  const show=c=>!S.cats.length||S.cats.includes(c);
  let s=`<svg id="map" viewBox="0 0 400 560" role="img" aria-label="Geländeplan mit Bühnen, Toiletten, Essen, Getränken, Wasser und Erster Hilfe">
   <rect x="0" y="0" width="400" height="560" fill="var(--map-bg)"/>
   <path d="M0 336 C60 322 140 330 176 352 L188 470 C120 488 50 482 0 476Z" fill="var(--map-forest)"/>
   <rect x="6" y="6" width="388" height="548" rx="16" fill="none" stroke="var(--map-edge)" stroke-width="3" stroke-dasharray="8 6"/>
   <path d="M200 552V96 M40 182H370 M200 356L300 340 M200 380L110 404 M200 270H340" stroke="var(--map-path)" stroke-width="16" stroke-linecap="round" fill="none"/>
   <text x="44" y="470" font-size="11" font-weight="700" fill="var(--map-text)" opacity=".55" font-family="Arial,sans-serif">Wäldchen</text>
   <g><rect x="168" y="540" width="64" height="16" rx="4" fill="var(--ok)"/><text x="200" y="551.5" text-anchor="middle" font-size="9.5" font-weight="800" fill="#fff" font-family="Arial,sans-serif">EINGANG</text></g>`;
  for(const [k,st] of Object.entries(STAGES)){
    const dim=!show('stage'),sel=S.sel==='st'+k;
    s+=`<g class="mk${sel?' sel':''}" data-poi="st${k}" opacity="${dim?.35:1}" role="button" aria-label="${st.name}">
      <rect x="${st.x-st.w/2}" y="${st.y-st.h/2}" width="${st.w}" height="${st.h}" rx="8" fill="var(--st-${k})" stroke="${sel?'var(--ink)':'none'}" stroke-width="3"/>
      <text x="${st.x}" y="${st.y+4.5}" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" font-family="Arial,sans-serif">${st.name}</text></g>`;
  }
  if(S.route&&S.sel){const p=poiById(S.sel);if(p)s+=`<line x1="${S.pos.x}" y1="${S.pos.y}" x2="${p.x}" y2="${p.y}" stroke="var(--ink)" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"/>`}
  for(const p of POIS){
    if(!show(p.c))continue;
    const sel=S.sel===p.id;
    s+=`<g class="mk${sel?' sel':''}" data-poi="${p.id}" transform="translate(${p.x} ${p.y})" role="button" aria-label="${esc(p.n)}">
      <circle r="18" fill="transparent"/>
      ${sel?'<circle r="16" fill="none" stroke="var(--ink)" stroke-width="3"/>':''}
      <circle class="ring" r="12" fill="${CATS[p.c].color}" stroke="#fff" stroke-width="2"/>${ICON[p.c]}</g>`;
  }
  s+=`<g class="you" transform="translate(${S.pos.x} ${S.pos.y})"><circle class="pulse" r="10" fill="var(--accent)" opacity=".5"/><circle r="8" fill="var(--accent)" stroke="#fff" stroke-width="3"/>
    <text y="-14" text-anchor="middle" font-size="11" font-weight="800" fill="var(--map-text)" font-family="Arial,sans-serif">Du</text></g></svg>`;
  return s;
}
function mapView(){
  const cats=Object.keys(CATS);
  let h=`<div><p class="eyebrow">Geländeplan</p><h1>Wo finde ich was?</h1></div>
   <div class="chips" role="group" aria-label="Kategorien filtern"><button class="chip" data-act="cat" data-v="all" aria-pressed="${!S.cats.length}">Alles</button>
   ${cats.map(c=>`<button class="chip" data-act="cat" data-v="${c}" aria-pressed="${S.cats.includes(c)}"><span class="dot" style="background:${c==='stage'?'var(--st-H)':CATS[c].color}"></span>${CATS[c].name}</button>`).join('')}</div>
   <div class="posbar"><div class="where">${SV.pin} <span class="muted small">Dein Standort</span><b>${esc(whereName(S.pos))}</b></div>
     <div style="display:flex;gap:6px;flex-wrap:wrap"><select id="posSel" data-ch="pos" aria-label="Standort wählen"><option value="">Ich stehe bei …</option>${LANDMARKS.map((l,i)=>`<option value="${i}">${l.n}</option>`).join('')}</select>
     <button class="btn sm${S.placing?' pri':''}" data-act="placing">${S.placing?'Abbrechen':'Auf Plan tippen'}</button></div></div>
   ${S.placing?'<p class="hint">Tippe auf die Stelle im Plan, an der du gerade stehst.</p>':''}
   <div class="mapwrap${S.placing?' placing':''}" id="mapwrap">${mapSVG()}</div>`;
  if(S.sel){const p=poiById(S.sel);
    if(p){const m=dist(p,S.pos);
      const icon=p.c==='stage'?`<span class="ic" style="background:var(--st-${p.stage})"><svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg></span>`:icCircle(p.c,22);
      let extra='';
      if(p.c==='stage'){const k=p.stage,list=ACTS.filter(a=>a.d===S.simDay&&a.s===k),run=list.find(a=>S.simMin>=a.s0&&S.simMin<a.s1),next=list.find(a=>a.s0>S.simMin);
        extra=`<p class="small">${run?`<span class="pill now">Jetzt</span> ${esc(run.n)} bis ${run.e}`:'Gerade Pause'}${next?` · danach ${esc(next.n)} um ${next.t}`:''}</p>`}
      h+=`<article class="card"><div class="poicard">${icon}<div><p class="eyebrow">${CATS[p.c].one}</p><h2>${esc(p.n)}</h2><p class="small muted">${esc(p.i)}</p>${extra}
        <p style="margin-top:6px"><b>ca. ${m} m</b> <span class="muted">· ${walk(m)} Min. zu Fuß</span></p></div></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm${S.route?' pri':''}" data-act="route">${S.route?'Richtung ausblenden':'Richtung zeigen'}</button><button class="btn sm" data-act="unsel">Schließen</button></div></article>`;
    }
  }
  h+=`<section style="display:flex;flex-direction:column;gap:10px"><h2>Am nächsten zu dir</h2><div class="near">
    ${['wc','food','drink','water','aid'].map(c=>{const p=nearest(c);return `<button data-act="goPoi" data-v="${p.id}">${icCircle(c,15)}<span><b>${esc(p.n)}</b><br><span class="small muted">${CATS[c].one}</span></span><span class="d">${p.m} m<small>${walk(p.m)} Min.</small></span></button>`}).join('')}
  </div><p class="small muted">Entfernungen sind Schätzungen auf Basis des Plans, nicht per GPS. So funktioniert alles auch ohne Netz und ohne Ortungsdienste.</p></section>`;
  return h;
}

/* ================= Rendering ================= */
const TABS=[['now','Jetzt','now'],['prog','Programm','prog'],['map','Plan','map']];
function render(top){
  const v=$('#view'),st=v.scrollTop;
  v.innerHTML=`<div class="vin">${S.tab==='prog'?progView():S.tab==='map'?mapView():nowView()}</div>`;
  if(!top)v.scrollTop=st;else v.scrollTop=0;
  $('#tabs').innerHTML=TABS.map(([k,l,ic])=>`<button class="tab" data-act="tab" data-v="${k}"${S.tab===k?' aria-current="page"':''}>${SV[ic]}${l}</button>`).join('');
  $('#clockLbl').textContent=`${DAYS[S.simDay]} · ${hhmm(S.simMin)} Uhr`;
  save();
}

/* ================= Aktionen ================= */
const A={
  tab(t){S.tab=t.dataset.v;S.placing=false;render(true)},
  toggleClock(){S.setClock=!S.setClock;render()},
  day(t){S.day=+t.dataset.v;S.open=null;render()},
  stage(t){S.stage=t.dataset.v;S.open=null;render()},
  openAct(t){const id=+t.dataset.v;S.open=S.open===id?null:id;render()},
  showStage(t){S.tab='map';S.sel='st'+t.dataset.v;S.route=true;S.cats=[];render(true)},
  goPoi(t){const p=poiById(t.dataset.v);S.tab='map';S.sel=p.id;S.route=true;if(S.cats.length&&!S.cats.includes(p.c))S.cats=[];render(true)},
  cat(t){const c=t.dataset.v;if(c==='all')S.cats=[];else S.cats=S.cats.includes(c)?S.cats.filter(x=>x!==c):[...S.cats,c];
    if(S.sel){const p=poiById(S.sel);if(p&&S.cats.length&&!S.cats.includes(p.c))S.sel=null}render()},
  placing(){S.placing=!S.placing;render()},
  route(){S.route=!S.route;render()},
  unsel(){S.sel=null;S.route=false;render()}
};
document.addEventListener('click',e=>{
  const mk=e.target.closest('[data-poi]');
  const wrap=e.target.closest('#mapwrap');
  if(wrap&&S.placing){
    const svg=$('#map'),pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;
    const p=pt.matrixTransform(svg.getScreenCTM().inverse());
    S.pos={x:Math.round(Math.min(392,Math.max(8,p.x))),y:Math.round(Math.min(552,Math.max(8,p.y)))};S.placing=false;
    toast('Standort gesetzt: '+whereName(S.pos));render();return;
  }
  if(mk){S.sel=S.sel===mk.dataset.poi?null:mk.dataset.poi;S.route=!!S.sel;render();return}
  const t=e.target.closest('[data-act]');if(t&&A[t.dataset.act])A[t.dataset.act](t,e);
});
document.addEventListener('change',e=>{
  const t=e.target,k=t.dataset.ch;if(!k)return;
  if(k==='simDay')S.simDay=+t.value;
  if(k==='simMin'&&/^\d\d:\d\d$/.test(t.value)){const [h,m]=t.value.split(':').map(Number);S.simMin=(h<6?h+24:h)*60+m}
  if(k==='pos'&&t.value!==''){const l=LANDMARKS[+t.value];S.pos={x:l.x,y:l.y};toast('Standort: '+l.n)}
  render();
});
function toast(msg,btn){
  const t=$('#toast');t.innerHTML=`<span>${esc(msg)}</span>${btn?`<button id="toastBtn">${esc(btn.label)}</button>`:''}`;t.hidden=false;
  if(btn)$('#toastBtn').onclick=btn.fn;
  clearTimeout(toast.t);if(!btn)toast.t=setTimeout(()=>t.hidden=true,2600);
}

/* ================= Offline (Service Worker) ================= */
let offlineReady=false;
function netStatus(){
  const el=$('#net'),span=el.querySelector('span');
  el.className='net';
  if(!navigator.onLine){el.classList.add('ok');span.textContent=offlineReady?'Kein Netz · läuft offline':'Kein Netz';return}
  if(offlineReady){el.classList.add('ok');span.textContent='Offline bereit'}
  else if('serviceWorker' in navigator&&window.isSecureContext&&location.protocol!=='file:'){el.classList.add('wait');span.textContent='Speichere für offline…'}
  else span.textContent='Online';
}
async function checkCache(){try{const keys=await caches.keys();offlineReady=keys.some(k=>k.startsWith('kesselklang-'))&&!!navigator.serviceWorker.controller}catch(e){}netStatus()}
if('serviceWorker' in navigator&&window.isSecureContext&&location.protocol!=='file:'){
  const had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready).then(()=>setTimeout(checkCache,600)).catch(()=>netStatus());
  navigator.serviceWorker.addEventListener('controllerchange',()=>{checkCache();if(had)toast('Neue Version verfügbar',{label:'Neu laden',fn:()=>location.reload()})});
}
addEventListener('online',netStatus);addEventListener('offline',netStatus);

render(true);netStatus();
</script>
</body>
</html>
